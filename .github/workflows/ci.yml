name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Typecheck and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Same major as the Docker image (node:22-alpine)
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # Sim cost (32 cars, target < 2 ms per tick): logged, warns above the
      # target, never fails the job (a wall clock on a shared runner)
      - run: npm run perf:sim

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Check build output
        run: |
          test -f dist/server/index.js
          test -f dist/client/index.html
          # The stale-client guard needs the version file and the stamp in index.html
          grep -Eq '^[a-f0-9]{16}$' dist/client/build-version.txt
          grep -q "name=\"bulli-build-version\" content=\"$(cat dist/client/build-version.txt)\"" dist/client/index.html
          # lil-gui (the ?sandbox=1&tune=1 panel) stays in its lazy chunk:
          # nothing the page loads up front contains it
          for file in dist/client/index.html $(grep -oE '/assets/[^"]+\.js' dist/client/index.html | sed 's#^#dist/client#'); do
            if grep -q "lil-gui" "$file"; then echo "lil-gui is loaded up front by $file"; exit 1; fi
          done
          # ...but it is there: the entry imports the tuning panel's chunk
          # (with lil-gui) and the sandbox's chunk on demand. No browser
          # starts the sandbox or the panel any more; their code runs in
          # tests/client/sandbox.test.ts
          entry=dist/client$(grep -oE '/assets/index-[^"]+\.js' dist/client/index.html | head -1)
          panel=$(grep -oE 'import\(.\./tuningPanel-[A-Za-z0-9_-]+\.js.\)' "$entry" | grep -oE 'tuningPanel-[A-Za-z0-9_-]+\.js' | head -1)
          if [ -z "$panel" ]; then echo "$entry does not import the tuning panel lazily"; exit 1; fi
          if ! grep -q "lil-gui" "dist/client/assets/$panel"; then echo "lil-gui is not in $panel"; exit 1; fi
          if ! grep -qE 'import\(.\./sandbox-[A-Za-z0-9_-]+\.js.\)' "$entry"; then echo "$entry does not import the sandbox lazily"; exit 1; fi

  bots:
    name: Bot integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Starts its own game server process and runs headless bots over real
      # WebSockets: a bump seen by both cars, reconnect, room switch, flood
      # kick, 16 bots behind netsim 150/30/3 with the bandwidth and tick
      # budgets (docs/phase-1b-design.md, 15.2)
      - run: npm run test:bots -- --reporter=verbose

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Chromium of this Playwright version from the cache; the system
      # libraries it needs come from apt either way
      - name: Playwright version
        id: playwright
        run: echo "version=$(node -p "require('./node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      # Builds, then runs the critical user paths against the production
      # server (see playwright.config.ts): desktop, two players, touch on a
      # phone, a new deploy, missing assets. Everything a unit or bot test
      # can check lives there instead; the suite stays under ~5 minutes.
      - run: npm run test:e2e
      - name: Upload Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  e2e-render:
    name: Render checks (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Chromium of this Playwright version from the cache; the system
      # libraries it needs come from apt either way
      - name: Playwright version
        id: playwright
        run: echo "version=$(node -p "require('./node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      # The phone tier's draw call and triangle budget and its texture
      # placeholders, measured by the renderer (SwiftShader), and the touch
      # HUD's layout in eight viewports: measurements, not user paths
      - run: npm run test:e2e:render
      - name: Upload Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-render
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: bulli-drive:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke-test the container
        run: |
          docker run -d --name bulli -p 8000:8000 bulli-drive:ci
          for attempt in $(seq 1 30); do
            curl -fsS http://localhost:8000/healthz && break
            sleep 1
          done
          # Healthy: the tick runs (docs/phase-1b-design.md, 11.4)
          curl -fsS http://localhost:8000/healthz | grep -q '"ok":true'
          grep -Eq '^[a-f0-9]{16}$' <(curl -fsS http://localhost:8000/build-version.txt)
          curl -fsS http://localhost:8000/ | grep -q 'bulli-build-version'
          # The image's own HEALTHCHECK turns healthy
          for attempt in $(seq 1 40); do
            status=$(docker inspect -f '{{.State.Health.Status}}' bulli)
            [ "$status" = healthy ] && break
            sleep 1
          done
          echo "health: $status"
          [ "$status" = healthy ]
      - name: Graceful shutdown on docker stop
        run: |
          # SIGTERM: the server tells the clients, closes with 1012 and exits
          # with 0 well before Docker's 10 s kill (11.2)
          start=$(date +%s%N)
          docker stop bulli
          elapsed_ms=$(( ($(date +%s%N) - start) / 1000000 ))
          code=$(docker inspect -f '{{.State.ExitCode}}' bulli)
          echo "stopped in ${elapsed_ms} ms with exit code ${code}"
          [ "$code" = 0 ]
          [ "$elapsed_ms" -lt 6000 ]
      - name: Container logs
        if: always()
        run: docker logs bulli || true
