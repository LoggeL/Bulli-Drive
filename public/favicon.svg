<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Body -->
  <rect x="6" y="20" width="52" height="22" rx="5" fill="#E84545"/>
  <!-- Upper body (white) -->
  <rect x="6" y="20" width="52" height="11" rx="5" fill="#F5F5F5"/>
  <rect x="6" y="27" width="52" height="4" fill="#F5F5F5"/>
  <!-- Windshield -->
  <rect x="42" y="14" width="14" height="14" rx="3" fill="#88BBDD" opacity="0.7"/>
  <!-- Side window -->
  <rect x="26" y="16" width="13" height="9" rx="2" fill="#88BBDD" opacity="0.5"/>
  <!-- Headlight -->
  <circle cx="57" cy="34" r="2.5" fill="#FFD700"/>
  <!-- Bumper -->
  <rect x="57" y="29" width="3" height="13" rx="1.5" fill="#CCC"/>
  <!-- VW Logo -->
  <circle cx="30" cy="35" r="3.5" fill="none" stroke="#FFF" stroke-width="1.2"/>
  <!-- Wheels -->
  <circle cx="18" cy="44" r="6" fill="#222"/>
  <circle cx="18" cy="44" r="3" fill="#999"/>
  <circle cx="48" cy="44" r="6" fill="#222"/>
  <circle cx="48" cy="44" r="3" fill="#999"/>
</svg>
